    .t-value   { font: 600 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; fill: #e6edf3;
                 font-variant-numeric: tabular-nums; }
